# Installers for macOS, Windows and Linux. Signing is driven by environment variables
# that CI fills from secrets (CLAUDE.md, "Commands"); without them a build is unsigned.
# macOS is notarised when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are set.
# Windows is not signed here: CI sends a release's program and installer to SignPath (docs/ops/code-signing.md).
appId: dev.motionhub.studio
productName: OpenMotionStudio
artifactName: open-motion-studio-${version}-${os}-${arch}.${ext}
directories:
  output: dist
files:
  - out/**
  - resources/**
  - package.json
# Binaries the app runs as processes cannot be read from inside the archive.
asarUnpack:
  - '**/node_modules/esbuild/**'
  - '**/node_modules/@esbuild/**'
  - '**/node_modules/ffmpeg-static/**'
npmRebuild: false
# The Studio's eased-square icon (resources/icon.svg, docs/design.md): a 1024 px picture electron-builder turns
# into the .icns and Linux's PNGs, and for Windows an .ico of 16 to 256 px. The window takes the same files
# (src/main/index.ts).
icon: resources/icon.png
# No update channel yet (auto-update is not in the first version), so no update metadata.
publish: null
mac:
  category: public.app-category.video
  hardenedRuntime: true
  target: [dmg, zip]
win:
  icon: resources/icon.ico
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: AudioVideo
  target: [AppImage, tar.gz]
