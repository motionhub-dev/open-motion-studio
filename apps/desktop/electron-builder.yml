# Installers for macOS, Windows and Linux. Signing is driven by environment variables
# that CI fills from secrets (CLAUDE.md, "Commands"); without them a build is unsigned.
# macOS is notarised when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are set.
appId: dev.motionhub.studio
productName: Open Motion Studio
artifactName: open-motion-studio-${version}-${os}-${arch}.${ext}
directories:
  output: dist
files:
  - out/**
  - resources/**
  - package.json
# Binaries the app runs as processes cannot be read from inside the archive.
asarUnpack:
  - '**/node_modules/esbuild/**'
  - '**/node_modules/@esbuild/**'
  - '**/node_modules/ffmpeg-static/**'
npmRebuild: false
# motionhub's app icon (brand/logo/ in motionhub-dev/motions): a 1024 px picture electron-builder turns into the
# .icns and Linux's PNGs, and for Windows an .ico whose 16 px is the brand's one-ball icon-16. The window takes
# the same files (src/main/index.ts).
icon: resources/icon.png
# No update channel yet (auto-update is not in the first version), so no update metadata.
publish: null
mac:
  category: public.app-category.video
  hardenedRuntime: true
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: AudioVideo
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: tar.gz
      arch: [x64, arm64]
