# The gate, then an installer for each platform. Signing and notarisation use the
# secrets named in CLAUDE.md ("Commands"); without them the installers are unsigned.
# Windows releases are signed by SignPath Foundation (docs/ops/code-signing.md).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Prepare a draft GitHub Release after all packages pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Package on the target CPU so esbuild and ffmpeg match Electron.
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # SignPath's action reads this job and downloads the artifacts it is sent.
      actions: read
    env:
      # Only a release is signed on Windows, since every signing there waits for an approver:
      # a v* tag, or a run that prepares a draft release.
      SIGN_WINDOWS: >-
        ${{ matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        && (startsWith(github.ref, 'refs/tags/v') || inputs.draft_release == true) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Signing is configured whole, or not at all
        run: node apps/desktop/scripts/check-signing.mjs
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      - name: Package
        # An empty secret still arrives as an empty variable, and electron-builder reads an empty CSC_LINK as a path
        # (the working directory: "not a file"), so each one that is empty is unset before packaging.
        shell: bash
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || unset "$name"
          done
          pnpm package
        env:
          # macOS: sign only when a certificate is configured, notarise only when Apple credentials are.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && secrets.CSC_LINK != '' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      # Windows, signed in two rounds: NSIS packs the program into the installer, so the program is signed first
      # (dist/win-unpacked, which `pnpm package` leaves beside the installer), the installer is built again around
      # the signed program, and then the installer itself is signed. The artifact configurations SignPath applies,
      # app and installer, are in docs/ops/code-signing.md.
      - name: Upload the Windows app for signing
        id: unsigned-app
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app-windows
          path: apps/desktop/dist/win-unpacked/
          if-no-files-found: error
      - name: Sign the Windows app
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: open-motion-studio
          signing-policy-slug: release-signing
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          # A release signing waits for an approver in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: apps/desktop/signed-app
      - name: Build the Windows installer around the signed app
        if: env.SIGN_WINDOWS == 'true'
        working-directory: apps/desktop
        shell: bash
        run: |
          rm -rf dist
          mkdir dist
          mv signed-app dist/win-unpacked
          pnpm exec electron-builder --win nsis --prepackaged dist/win-unpacked --publish never
      - name: Stage the Windows installer for the existing SignPath filename rule
        if: env.SIGN_WINDOWS == 'true'
        working-directory: apps/desktop
        shell: bash
        run: |
          mkdir unsigned-installer
          for installer in dist/OpenMotionStudio-*-win-x64.exe; do
            name="${installer#dist/OpenMotionStudio-}"
            cp "$installer" "unsigned-installer/open-motion-studio-$name"
          done
      - name: Upload the Windows installer for signing
        id: unsigned-installer
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer-windows
          path: apps/desktop/unsigned-installer/*.exe
          if-no-files-found: error
      - name: Sign the Windows installer
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: open-motion-studio
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: apps/desktop/signed-installer
      - name: Put the signed Windows installer in place
        if: env.SIGN_WINDOWS == 'true'
        working-directory: apps/desktop
        shell: bash
        run: |
          for installer in signed-installer/open-motion-studio-*-win-x64.exe; do
            name="${installer#signed-installer/open-motion-studio-}"
            mv -f "$installer" "dist/OpenMotionStudio-$name"
          done
          rm -rf signed-installer
          # The installer and the program inside it each carry a valid signature, or the release stops here.
          for file in dist/*.exe dist/win-unpacked/OpenMotionStudio.exe; do
            status=$(powershell -NoProfile -Command "(Get-AuthenticodeSignature '$file').Status" | tr -d '\r')
            echo "$file: $status"
            [ "$status" = "Valid" ]
          done
      - name: Check the packaged video tools
        shell: bash
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          tools_dir=$(find apps/desktop/dist -type d -name app.asar.unpacked -print -quit)
          ffmpeg=$(find "$tools_dir" -path "*/ffmpeg-static/ffmpeg$suffix" -type f -print -quit)
          esbuild=$(find "$tools_dir" -path "*/@esbuild/*/esbuild$suffix" -type f -print -quit)
          "$ffmpeg" -version
          "$esbuild" --version
      - name: Collect update metadata
        shell: bash
        env:
          MAC_NOTARIZED: ${{ runner.os == 'macOS' && secrets.CSC_LINK != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          cd apps/desktop/dist
          if [[ "$RUNNER_OS" == Linux ]]; then
            if [[ "$RUNNER_ARCH" == X64 ]]; then
              cp latest-linux.yml update-linux-x64.yml
            else
              cp latest-linux-arm64.yml update-linux-arm64.yml
            fi
          elif [[ "$MAC_NOTARIZED" == true ]]; then
            if [[ "$RUNNER_ARCH" == ARM64 ]]; then arch=arm64; else arch=x64; fi
            shopt -s failglob
            zip=(OpenMotionStudio-*-mac-"$arch".zip)
            extracted=$(mktemp -d)
            trap 'rm -rf "$extracted"' EXIT
            ditto -x -k "${zip[0]}" "$extracted"
            bundle="$extracted/OpenMotionStudio.app"
            codesign --verify --deep --strict -R '=anchor apple generic and certificate leaf[field.1.2.840.113635.100.6.1.13] exists' "$bundle"
            xcrun stapler validate "$bundle"
            cp latest-mac.yml "update-mac-$arch.yml"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}-${{ runner.arch }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.tar.gz
            apps/desktop/dist/*.dmg.blockmap
            apps/desktop/dist/*.zip.blockmap
            apps/desktop/dist/update-*.yml
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.draft_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
      - name: Attach the installers and their checksums to a draft
        working-directory: installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('../apps/desktop/package.json').version")"
          mkdir release
          ruby ../apps/desktop/scripts/assemble-updates.rb "$tag" release installers-*
          cd release
          sha256sum OpenMotionStudio-* > SHA256SUMS.txt
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --generate-notes --title "OpenMotionStudio $tag"
          fi
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
          # The draft was created from this commit. Never modify a published release.
          gh release upload "$tag" ./* --clobber
